<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Travel Fitness NC share card</title>
  <style>
    @font-face {
      font-family: "Figtree";
      font-style: normal;
      font-weight: 500;
      src: url("fonts/Figtree-500.ttf") format("truetype");
    }
    @font-face {
      font-family: "Figtree";
      font-style: normal;
      font-weight: 600;
      src: url("fonts/Figtree-600.ttf") format("truetype");
    }
    @font-face {
      font-family: "Figtree";
      font-style: normal;
      font-weight: 700;
      src: url("fonts/Figtree-700.ttf") format("truetype");
    }
    @font-face {
      font-family: "Fraunces";
      font-style: normal;
      font-weight: 560;
      src: url("fonts/Fraunces-560.ttf") format("truetype");
    }
    @font-face {
      font-family: "Fraunces";
      font-style: normal;
      font-weight: 700;
      src: url("fonts/Fraunces-700.ttf") format("truetype");
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #e7f2fb;
    }

    .card {
      width: 1200px;
      height: 630px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 36px;
      padding: 48px 72px;
      background:
        radial-gradient(520px 420px at 28% 50%, #ffffff 0%, rgba(255, 255, 255, 0) 70%),
        #e7f2fb;
      color: #323232;
    }

    .mark {
      width: 430px;
      height: 430px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .copy {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      min-width: 0;
    }

    .eyebrow {
      font-family: "Figtree", sans-serif;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #1c72c0;
    }

    h1 {
      margin-top: 14px;
      font-family: "Fraunces", Georgia, serif;
      font-weight: 560;
      font-size: 78px;
      line-height: 0.9;
      letter-spacing: -0.03em;
      color: #323232;
    }

    h1 span {
      display: block;
      margin-top: 6px;
      color: #1c72c0;
    }

    .rule {
      width: 72px;
      height: 5px;
      margin-top: 22px;
      border-radius: 999px;
      background: #1c72c0;
    }

    .tag {
      margin-top: 18px;
      font-family: "Figtree", sans-serif;
      font-weight: 500;
      font-size: 28px;
      line-height: 1.2;
      color: #323232;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="mark" src="mark-crop.png" alt="" />
    <div class="copy">
      <p class="eyebrow">North Carolina Triad</p>
      <h1>Travel Fitness<span>NC</span></h1>
      <div class="rule"></div>
      <p class="tag">Bringing the gym to you.</p>
    </div>
  </div>
</body>
</html>
